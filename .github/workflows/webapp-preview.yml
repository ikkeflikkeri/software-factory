name: webapp-preview

on:
  pull_request:
    paths: ['webapp/**', '.github/workflows/webapp-preview.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-preview-${{ github.event.number }}
          path: webapp/dist
          retention-days: 14

      - name: Comment artifact link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Built webapp preview: [download the \`webapp-preview-${context.issue.number}\` artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and serve the unpacked \`dist\` locally (e.g. \`npx serve\`). GitHub Pages hosts only the \`main\` deployment.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = 'Built webapp preview:';
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
