name: webapp-ci

on:
  push:
    branches: [main]
    paths: ['webapp/**']
  pull_request:
    paths: ['webapp/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
