name: webapp-pages

on:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/webapp-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      # GitHub Pages has no SPA rewrite: serve the app shell on 404 so deep
      # links like /software-factory/trace/7 boot the client-side router.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

      - id: deployment
        uses: actions/deploy-pages@v4
